<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="290" viewBox="0 0 1200 290" role="img" aria-label="eCIR Diploma — ITGate Academy — Enterprise incident response · 10 sessions · SOC lab · investigation challenges">
<title>eCIR Diploma — ITGate Academy — Enterprise incident response · 10 sessions · SOC lab · investigation challenges</title>
<defs>
