<svg viewBox="0 0 1040 320" xmlns="http://www.w3.org/2000/svg" font-family="Segoe UI, Arial, sans-serif" role="img" aria-label="One Sigma rule converts to Splunk, Elastic, QRadar and Wazuh queries">
<title>Sigma conversion to backends</title>
<defs>
<marker id="cv" markerWidth="10" markerHeight="10" refX="8" refY="4" orient="auto"><path d="M0,0 L8,4 L0,8 Z" fill="#37c7d4"/></marker>
</defs>
<rect width="1040" height="320" fill="#0a1226"/>
<text x="28" y="34" fill="#fff" font-size="18" font-weight="700">Write Once, Convert Anywhere</text>
<text x="1012" y="34" fill="#d4af37" font-size="12" font-weight="700" text-anchor="end">IT GATE</text>
<text x="28" y="56" fill="#8ea3c8" font-size="12">A Sigma rule avoids vendor lock-in — convert with sigma-cli / sigmac or uncoder.io.</text>

<!-- source rule -->
<rect x="40" y="110" width="220" height="120" rx="12" fill="#1a1533" stroke="#8b7ce8" stroke-width="1.6"/>
<text x="150" y="150" text-anchor="middle" fill="#b6a9f2" font-size="15" font-weight="700">Sigma rule</text>
<text x="150" y="174" text-anchor="middle" fill="#c7d3e8" font-size="11">generic YAML</text>
<text x="150" y="194" text-anchor="middle" fill="#8ea3c8" font-size="10">one detection idea</text>

<!-- converter -->
<rect x="330" y="130" width="150" height="80" rx="10" fill="#0e1730" stroke="#d4af37" stroke-width="1.4"/>
<text x="405" y="164" text-anchor="middle" fill="#f0d78a" font-size="12" font-weight="700">Converter</text>
<text x="405" y="184" text-anchor="middle" fill="#8ea3c8" font-size="10">sigma-cli · uncoder.io</text>
<path d="M260 170 L328 170" stroke="#8b7ce8" stroke-width="2" marker-end="url(#cv)"/>

<!-- backends -->
<rect x="560" y="80" width="220" height="46" rx="8" fill="#101f1a" stroke="#3fa87a"/>
<text x="576" y="108" fill="#7fe0b4" font-size="12" font-weight="700">Splunk SPL</text>
<rect x="560" y="136" width="220" height="46" rx="8" fill="#101f1a" stroke="#3fa87a"/>
<text x="576" y="164" fill="#7fe0b4" font-size="12" font-weight="700">Elastic / Lucene</text>
<rect x="560" y="192" width="220" height="46" rx="8" fill="#101f1a" stroke="#3fa87a"/>
<text x="576" y="220" fill="#7fe0b4" font-size="12" font-weight="700">QRadar AQL</text>
<rect x="820" y="136" width="180" height="46" rx="8" fill="#2a1620" stroke="#e0556b"/>
<text x="836" y="164" fill="#f2a6b4" font-size="12" font-weight="700">Wazuh / others</text>

<path d="M480 165 L558 103" stroke="#37c7d4" stroke-width="1.7" marker-end="url(#cv)"/>
<path d="M480 170 L558 159" stroke="#37c7d4" stroke-width="1.7" marker-end="url(#cv)"/>
<path d="M480 175 L558 215" stroke="#37c7d4" stroke-width="1.7" marker-end="url(#cv)"/>
<path d="M780 159 L818 159" stroke="#37c7d4" stroke-width="1.7" marker-end="url(#cv)"/>

<text x="40" y="278" fill="#f0d78a" font-size="12" font-weight="700">Watch out:</text>
<text x="120" y="278" fill="#c7d3e8" font-size="11.5">converted queries may need hand-tuning — escaped characters (\ *), field names, wildcards.</text>
<text x="40" y="300" fill="#8ea3c8" font-size="11">Always test the converted query against real data before you trust it.</text>
</svg>
