<svg viewBox="0 0 1040 380" xmlns="http://www.w3.org/2000/svg" font-family="Segoe UI, Arial, sans-serif" role="img" aria-label="Wazuh flow: raw log to decoder extracting fields to rule matching to alert with level and MITRE">
<title>Wazuh decoder and rule flow</title>
<defs>
<marker id="wz" markerWidth="10" markerHeight="10" refX="8" refY="4" orient="auto"><path d="M0,0 L8,4 L0,8 Z" fill="#37c7d4"/></marker>
</defs>
<rect width="1040" height="380" fill="#0a1226"/>
<text x="28" y="34" fill="#fff" font-size="18" font-weight="700">How Wazuh Turns a Log Into an Alert</text>
<text x="1012" y="34" fill="#d4af37" font-size="12" font-weight="700" text-anchor="end">IT GATE</text>
<text x="28" y="56" fill="#8ea3c8" font-size="12">Decoders extract the fields · Rules test the fields and set severity + ATT&amp;CK.</text>

<!-- Raw log -->
<rect x="24" y="80" width="300" height="120" rx="10" fill="#0e1730" stroke="#2b3f70"/>
<text x="40" y="104" fill="#c7d3e8" font-size="12.5" font-weight="700">1 · Raw event (Sysmon EID 1)</text>
<text x="40" y="126" fill="#93b0d8" font-size="10" font-family="monospace">Image: ...\powershell.exe</text>
<text x="40" y="144" fill="#93b0d8" font-size="10" font-family="monospace">CommandLine: -file test.ps1</text>
<text x="40" y="162" fill="#93b0d8" font-size="10" font-family="monospace">ParentImage: explorer.exe</text>
<text x="40" y="180" fill="#93b0d8" font-size="10" font-family="monospace">Hashes: SHA256=6C05E1...</text>

<!-- Decoder -->
<rect x="370" y="80" width="300" height="120" rx="10" fill="#101f1a" stroke="#3fa87a" stroke-width="1.5"/>
<text x="386" y="104" fill="#7fe0b4" font-size="12.5" font-weight="700">2 · Decoder (regex extracts)</text>
<text x="386" y="126" fill="#8fd0b4" font-size="10" font-family="monospace">prematch → confirms format</text>
<text x="386" y="144" fill="#8fd0b4" font-size="10" font-family="monospace">regex ( ) → captures values</text>
<text x="386" y="162" fill="#8fd0b4" font-size="10" font-family="monospace">order → sysmon.image,</text>
<text x="386" y="180" fill="#8fd0b4" font-size="10" font-family="monospace">        sysmon.commandLine ...</text>

<!-- Rule -->
<rect x="716" y="80" width="300" height="120" rx="10" fill="#2a1620" stroke="#e0556b" stroke-width="1.5"/>
<text x="732" y="104" fill="#f2a6b4" font-size="12.5" font-weight="700">3 · Rule (tests the fields)</text>
<text x="732" y="126" fill="#e6a9b4" font-size="10" font-family="monospace">field name="sysmon.image"</text>
<text x="732" y="144" fill="#e6a9b4" font-size="10" font-family="monospace">level="12"  (severity 0–15)</text>
<text x="732" y="162" fill="#e6a9b4" font-size="10" font-family="monospace">mitre id="T1055"</text>
<text x="732" y="180" fill="#e6a9b4" font-size="10" font-family="monospace">→ ALERT generated</text>

<path d="M324 140 L368 140" stroke="#37c7d4" stroke-width="1.9" marker-end="url(#wz)"/>
<path d="M670 140 L714 140" stroke="#37c7d4" stroke-width="1.9" marker-end="url(#wz)"/>

<!-- rule order -->
<rect x="24" y="230" width="992" height="122" rx="10" fill="#0e1730" stroke="#d4af37" stroke-width="1.3"/>
<text x="40" y="256" fill="#f0d78a" font-size="13" font-weight="700">Rule order — parent before child (top-down)</text>
<rect x="60" y="272" width="180" height="52" rx="8" fill="#15213f" stroke="#2b3f70"/>
<text x="150" y="294" text-anchor="middle" fill="#c7d3e8" font-size="11" font-weight="700">Base rule 184665</text>
<text x="150" y="312" text-anchor="middle" fill="#8ea3c8" font-size="9.5">if_group sysmon_event1</text>
<rect x="300" y="272" width="180" height="52" rx="8" fill="#15213f" stroke="#2b3f70"/>
<text x="390" y="294" text-anchor="middle" fill="#c7d3e8" font-size="11" font-weight="700">Rule 184666</text>
<text x="390" y="312" text-anchor="middle" fill="#8ea3c8" font-size="9.5">matches svchost.exe</text>
<rect x="540" y="272" width="180" height="52" rx="8" fill="#241a2e" stroke="#8b7ce8"/>
<text x="630" y="294" text-anchor="middle" fill="#b6a9f2" font-size="11" font-weight="700">Custom 100002</text>
<text x="630" y="312" text-anchor="middle" fill="#8ea3c8" font-size="9.5">if_sid → your rule</text>
<rect x="780" y="272" width="200" height="52" rx="8" fill="#101f1a" stroke="#3fa87a"/>
<text x="880" y="294" text-anchor="middle" fill="#7fe0b4" font-size="11" font-weight="700">Custom IDs ≥ 100000</text>
<text x="880" y="312" text-anchor="middle" fill="#8ea3c8" font-size="9.5">local_rules.xml</text>
<path d="M240 298 L298 298" stroke="#d4af37" stroke-width="1.7" marker-end="url(#wz)"/>
<path d="M480 298 L538 298" stroke="#d4af37" stroke-width="1.7" marker-end="url(#wz)"/>
<path d="M720 298 L778 298" stroke="#8b7ce8" stroke-width="1.7" marker-end="url(#wz)"/>
</svg>
