<svg viewBox="0 0 980 624" xmlns="http://www.w3.org/2000/svg" font-family="Segoe UI, Arial, sans-serif" role="img" aria-label="Process flow of incident recording and assignment, from incident occurrence through help desk, response decisions, recording and IR team assignment">
<title>Process Flow of Incident Recording and Assignment</title>
<defs>
  <marker id="rA" markerWidth="9" markerHeight="9" refX="7" refY="3.5" orient="auto"><path d="M0,0 L7,3.5 L0,7 Z" fill="#3fa87a"/></marker>
  <marker id="rR" markerWidth="9" markerHeight="9" refX="7" refY="3.5" orient="auto"><path d="M0,0 L7,3.5 L0,7 Z" fill="#e0556b"/></marker>
  <marker id="rB" markerWidth="9" markerHeight="9" refX="7" refY="3.5" orient="auto"><path d="M0,0 L7,3.5 L0,7 Z" fill="#37c7d4"/></marker>
</defs>
<rect width="980" height="624" fill="#0a1226"/>
<text x="28" y="36" fill="#fff" font-size="17" font-weight="700">Process Flow of Incident Recording and Assignment</text>
<text x="952" y="36" fill="#d4af37" font-size="11" font-weight="700" text-anchor="end">IT GATE</text>

<!-- Incident Occurrence -->
<rect x="400" y="62" width="180" height="46" rx="6" fill="#10241c" stroke="#3fa87a" stroke-width="1.6"/>
<text x="490" y="82" text-anchor="middle" fill="#9ceccb" font-size="12" font-weight="700">Incident</text>
<text x="490" y="99" text-anchor="middle" fill="#9ceccb" font-size="12" font-weight="700">Occurrence</text>

<!-- End Users Call Help Desk -->
<rect x="368" y="134" width="244" height="34" rx="6" fill="#10241c" stroke="#3fa87a" stroke-width="1.6"/>
<text x="490" y="156" text-anchor="middle" fill="#9ceccb" font-size="12" font-weight="700">End Users Call Help Desk</text>
<path d="M490 108 L490 132" stroke="#3fa87a" stroke-width="1.6" marker-end="url(#rA)"/>

<!-- D1: Does the Incident Require a Response? -->
<polygon points="490,186 632,232 490,278 348,232" fill="#10241c" stroke="#3fa87a" stroke-width="2"/>
<text x="490" y="221" text-anchor="middle" fill="#9ceccb" font-size="11" font-weight="700">Does the</text>
<text x="490" y="236" text-anchor="middle" fill="#9ceccb" font-size="11" font-weight="700">Incident Require a</text>
<text x="490" y="251" text-anchor="middle" fill="#9ceccb" font-size="11" font-weight="700">Response?</text>
<path d="M490 168 L490 184" stroke="#3fa87a" stroke-width="1.6" marker-end="url(#rA)"/>

<!-- NO -> Close Incident Report (left) -->
<circle cx="316" cy="212" r="9" fill="#e0556b"/><path d="M312 208 l8 8 M320 208 l-8 8" stroke="#0a1226" stroke-width="2" stroke-linecap="round"/>
<text x="330" y="217" fill="#e0556b" font-size="12" font-weight="700">NO</text>
<rect x="60" y="214" width="184" height="36" rx="6" fill="#0d2030" stroke="#37c7d4" stroke-width="1.6"/>
<text x="152" y="237" text-anchor="middle" fill="#7fdce6" font-size="12" font-weight="700">Close Incident Report</text>
<path d="M348 232 L246 232" stroke="#e0556b" stroke-width="1.6" stroke-dasharray="5 4" marker-end="url(#rR)"/>

<!-- YES down -->
<circle cx="446" cy="296" r="9" fill="#3fa87a"/><path d="M441 296 l4 4 l7 -8" fill="none" stroke="#0a1226" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/>
<text x="460" y="301" fill="#3fa87a" font-size="12" font-weight="700">YES</text>

<!-- D2: Was the Incident Previously Closed? -->
<polygon points="490,314 632,354 490,394 348,354" fill="#10241c" stroke="#3fa87a" stroke-width="2"/>
<text x="490" y="350" text-anchor="middle" fill="#9ceccb" font-size="11" font-weight="700">Was the Incident</text>
<text x="490" y="365" text-anchor="middle" fill="#9ceccb" font-size="11" font-weight="700">Previously Closed?</text>
<path d="M490 278 L490 312" stroke="#3fa87a" stroke-width="1.6" marker-end="url(#rA)"/>

<!-- YES -> Reopen (right) -->
<circle cx="662" cy="336" r="9" fill="#3fa87a"/><path d="M657 336 l4 4 l7 -8" fill="none" stroke="#0a1226" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/>
<text x="676" y="341" fill="#3fa87a" font-size="12" font-weight="700">YES</text>
<rect x="736" y="336" width="212" height="46" rx="6" fill="#2a1420" stroke="#e0556b" stroke-width="1.6"/>
<text x="842" y="356" text-anchor="middle" fill="#f2a6b4" font-size="12" font-weight="700">Reopen Previously</text>
<text x="842" y="373" text-anchor="middle" fill="#f2a6b4" font-size="12" font-weight="700">Closed Incident</text>
<path d="M632 354 L734 354" stroke="#3fa87a" stroke-width="1.6" stroke-dasharray="5 4" marker-end="url(#rA)"/>

<!-- NO down -->
<circle cx="446" cy="410" r="9" fill="#e0556b"/><path d="M442 406 l8 8 M450 406 l-8 8" stroke="#0a1226" stroke-width="2" stroke-linecap="round"/>
<text x="460" y="415" fill="#e0556b" font-size="12" font-weight="700">NO</text>

<!-- Record/Update the Incident Record -->
<rect x="368" y="428" width="244" height="46" rx="6" fill="#10241c" stroke="#3fa87a" stroke-width="1.6"/>
<text x="490" y="448" text-anchor="middle" fill="#9ceccb" font-size="12" font-weight="700">Record/Update</text>
<text x="490" y="465" text-anchor="middle" fill="#9ceccb" font-size="12" font-weight="700">the Incident Record</text>
<path d="M490 394 L490 426" stroke="#e0556b" stroke-width="1.6" marker-end="url(#rR)"/>

<!-- IT Dept. Detects Security Alerts (left, into Record) -->
<rect x="60" y="433" width="228" height="36" rx="6" fill="#0d2030" stroke="#37c7d4" stroke-width="1.6"/>
<text x="174" y="456" text-anchor="middle" fill="#7fdce6" font-size="12" font-weight="700">IT Dept. Detects Security Alerts</text>
<path d="M288 451 L366 451" stroke="#37c7d4" stroke-width="1.6" stroke-dasharray="5 4" marker-end="url(#rB)"/>

<!-- Reopen feeds back into Record -->
<path d="M842 382 L842 451 L614 451" stroke="#e0556b" stroke-width="1.6" fill="none" stroke-dasharray="5 4" marker-end="url(#rR)"/>

<!-- IH&R Team Analyzes and Validates Incident -->
<rect x="368" y="494" width="244" height="46" rx="6" fill="#10241c" stroke="#3fa87a" stroke-width="1.6"/>
<text x="490" y="514" text-anchor="middle" fill="#9ceccb" font-size="12" font-weight="700">IH&amp;R Team Analyzes</text>
<text x="490" y="531" text-anchor="middle" fill="#9ceccb" font-size="12" font-weight="700">and Validates Incident</text>
<path d="M490 474 L490 492" stroke="#3fa87a" stroke-width="1.6" marker-end="url(#rA)"/>

<!-- D3: Is a Response Required? -->
<polygon points="490,548 616,574 490,600 364,574" fill="#10241c" stroke="#3fa87a" stroke-width="2"/>
<text x="490" y="571" text-anchor="middle" fill="#9ceccb" font-size="11" font-weight="700">Is a Response</text>
<text x="490" y="586" text-anchor="middle" fill="#9ceccb" font-size="11" font-weight="700">Required?</text>

<!-- NO -> Close Incident Report -->
<circle cx="332" cy="562" r="9" fill="#e0556b"/><path d="M328 558 l8 8 M336 558 l-8 8" stroke="#0a1226" stroke-width="2" stroke-linecap="round"/>
<text x="346" y="567" fill="#e0556b" font-size="12" font-weight="700">NO</text>
<rect x="60" y="556" width="184" height="36" rx="6" fill="#0d2030" stroke="#37c7d4" stroke-width="1.6"/>
<text x="152" y="579" text-anchor="middle" fill="#7fdce6" font-size="12" font-weight="700">Close Incident Report</text>
<path d="M364 574 L246 574" stroke="#e0556b" stroke-width="1.6" stroke-dasharray="5 4" marker-end="url(#rR)"/>

<!-- YES -> IR Team Assigned -->
<circle cx="646" cy="562" r="9" fill="#3fa87a"/><path d="M641 562 l4 4 l7 -8" fill="none" stroke="#0a1226" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/>
<text x="660" y="567" fill="#3fa87a" font-size="12" font-weight="700">YES</text>
<rect x="756" y="556" width="192" height="36" rx="6" fill="#2a1420" stroke="#e0556b" stroke-width="1.6"/>
<text x="852" y="579" text-anchor="middle" fill="#f2a6b4" font-size="12" font-weight="700">IR Team Assigned</text>
<path d="M616 574 L754 574" stroke="#3fa87a" stroke-width="1.6" stroke-dasharray="5 4" marker-end="url(#rA)"/>
</svg>
