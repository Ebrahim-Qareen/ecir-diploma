<svg viewBox="0 0 940 470" xmlns="http://www.w3.org/2000/svg" font-family="Segoe UI, Arial, sans-serif" role="img" aria-label="Process flow of recovery: eliminate the cause of the incident, is data lost decision, recover data from backup, restart services and processes">
<title>Process flow of Recovery</title>
<defs>
  <marker id="vG" markerWidth="9" markerHeight="9" refX="7" refY="3.5" orient="auto"><path d="M0,0 L7,3.5 L0,7 Z" fill="#3fa87a"/></marker>
  <marker id="vR" markerWidth="9" markerHeight="9" refX="7" refY="3.5" orient="auto"><path d="M0,0 L7,3.5 L0,7 Z" fill="#e0556b"/></marker>
</defs>
<rect width="940" height="470" fill="#0a1226"/>
<text x="28" y="36" fill="#fff" font-size="17" font-weight="700">Process flow of Recovery</text>
<text x="912" y="36" fill="#d4af37" font-size="11" font-weight="700" text-anchor="end">IT GATE</text>

<!-- start connector -->
<circle cx="470" cy="82" r="18" fill="#d4af37"/>
<text x="470" y="89" text-anchor="middle" fill="#0a1226" font-size="16" font-weight="700">…</text>

<!-- Eliminate the Cause of the Incident -->
<rect x="300" y="120" width="340" height="38" rx="6" fill="#2a1420" stroke="#e0556b" stroke-width="1.6"/>
<text x="470" y="144" text-anchor="middle" fill="#f2a6b4" font-size="12.5" font-weight="700">Eliminate the Cause of the Incident</text>
<path d="M470 100 L470 118" stroke="#e0556b" stroke-width="1.6" stroke-dasharray="5 4" marker-end="url(#vR)"/>

<!-- D1 Is Data Lost? -->
<polygon points="470,182 620,226 470,270 320,226" fill="#2a1420" stroke="#e0556b" stroke-width="2"/>
<text x="470" y="231" text-anchor="middle" fill="#f7c2cc" font-size="12.5" font-weight="700">Is Data Lost?</text>
<path d="M470 158 L470 180" stroke="#e0556b" stroke-width="1.6" stroke-dasharray="5 4" marker-end="url(#vR)"/>

<!-- NO left -->
<circle cx="298" cy="206" r="9" fill="#e0556b"/><path d="M294 202 l8 8 M302 202 l-8 8" stroke="#0a1226" stroke-width="2" stroke-linecap="round"/>
<text x="266" y="211" fill="#e0556b" font-size="12" font-weight="700">NO</text>
<path d="M320 226 L240 226 L240 388 L298 388" stroke="#e0556b" stroke-width="1.6" fill="none" stroke-dasharray="5 4" marker-end="url(#vR)"/>

<!-- YES down -->
<circle cx="426" cy="288" r="9" fill="#3fa87a"/><path d="M421 288 l4 4 l7 -8" fill="none" stroke="#0a1226" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/>
<text x="380" y="293" fill="#3fa87a" font-size="12" font-weight="700">YES</text>

<!-- Recover Data from Backup -->
<rect x="300" y="306" width="340" height="38" rx="6" fill="#2a1420" stroke="#e0556b" stroke-width="1.6"/>
<text x="470" y="330" text-anchor="middle" fill="#f2a6b4" font-size="12.5" font-weight="700">Recover Data from Backup</text>
<path d="M470 270 L470 304" stroke="#3fa87a" stroke-width="1.6" stroke-dasharray="5 4" marker-end="url(#vG)"/>

<!-- Restart Services and Processes (highlighted) -->
<rect x="300" y="370" width="340" height="38" rx="6" fill="#2a1420" stroke="#d4af37" stroke-width="2.6"/>
<text x="470" y="394" text-anchor="middle" fill="#f2a6b4" font-size="12.5" font-weight="700">Restart Services and Processes</text>
<path d="M470 344 L470 368" stroke="#e0556b" stroke-width="1.6" stroke-dasharray="5 4" marker-end="url(#vR)"/>

<!-- end connector -->
<circle cx="736" cy="389" r="18" fill="#d4af37"/>
<text x="736" y="396" text-anchor="middle" fill="#0a1226" font-size="16" font-weight="700">…</text>
<path d="M640 389 L716 389" stroke="#e0556b" stroke-width="1.6" stroke-dasharray="5 4" marker-end="url(#vR)"/>
</svg>
