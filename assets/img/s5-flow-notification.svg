<svg viewBox="0 0 940 544" xmlns="http://www.w3.org/2000/svg" font-family="Segoe UI, Arial, sans-serif" role="img" aria-label="Notification process flow: notify management, approval decision, notify stakeholders, external support decision, contact external agencies, plan for incident handling">
<title>Notification Process Flow</title>
<defs>
  <marker id="nG" markerWidth="9" markerHeight="9" refX="7" refY="3.5" orient="auto"><path d="M0,0 L7,3.5 L0,7 Z" fill="#3fa87a"/></marker>
  <marker id="nR" markerWidth="9" markerHeight="9" refX="7" refY="3.5" orient="auto"><path d="M0,0 L7,3.5 L0,7 Z" fill="#e0556b"/></marker>
</defs>
<rect width="940" height="544" fill="#0a1226"/>
<text x="28" y="36" fill="#fff" font-size="17" font-weight="700">Notification Process Flow</text>
<text x="912" y="36" fill="#d4af37" font-size="11" font-weight="700" text-anchor="end">IT GATE</text>

<!-- start connector -->
<circle cx="330" cy="82" r="18" fill="#d4af37"/>
<text x="330" y="89" text-anchor="middle" fill="#0a1226" font-size="16" font-weight="700">…</text>

<!-- Notify Management -->
<rect x="196" y="122" width="268" height="38" rx="6" fill="#2a1420" stroke="#e0556b" stroke-width="1.6"/>
<text x="330" y="146" text-anchor="middle" fill="#f2a6b4" font-size="12.5" font-weight="700">Notify Management</text>
<path d="M330 100 L330 120" stroke="#e0556b" stroke-width="1.6" stroke-dasharray="5 4" marker-end="url(#nR)"/>

<!-- D1 Approval for Notification -->
<polygon points="330,180 464,222 330,264 196,222" fill="#2a1420" stroke="#e0556b" stroke-width="2"/>
<text x="330" y="218" text-anchor="middle" fill="#f7c2cc" font-size="11.5" font-weight="700">Approval for</text>
<text x="330" y="234" text-anchor="middle" fill="#f7c2cc" font-size="11.5" font-weight="700">Notification</text>
<path d="M330 160 L330 178" stroke="#e0556b" stroke-width="1.6" stroke-dasharray="5 4" marker-end="url(#nR)"/>

<!-- NO right -->
<circle cx="486" cy="202" r="9" fill="#e0556b"/><path d="M482 198 l8 8 M490 198 l-8 8" stroke="#0a1226" stroke-width="2" stroke-linecap="round"/>
<text x="500" y="207" fill="#e0556b" font-size="12" font-weight="700">NO</text>
<path d="M464 222 L560 222" stroke="#e0556b" stroke-width="1.6" fill="none" stroke-dasharray="5 4"/>

<!-- YES down -->
<circle cx="286" cy="282" r="9" fill="#3fa87a"/><path d="M281 282 l4 4 l7 -8" fill="none" stroke="#0a1226" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/>
<text x="240" y="287" fill="#3fa87a" font-size="12" font-weight="700">YES</text>

<!-- Notify the Required Stakeholders -->
<rect x="196" y="300" width="268" height="46" rx="6" fill="#2a1420" stroke="#e0556b" stroke-width="1.6"/>
<text x="330" y="320" text-anchor="middle" fill="#f2a6b4" font-size="12.5" font-weight="700">Notify the Required</text>
<text x="330" y="337" text-anchor="middle" fill="#f2a6b4" font-size="12.5" font-weight="700">Stakeholders</text>
<path d="M330 264 L330 298" stroke="#3fa87a" stroke-width="1.6" stroke-dasharray="5 4" marker-end="url(#nG)"/>

<!-- D2 External Support Required? -->
<polygon points="330,360 464,400 330,440 196,400" fill="#2a1420" stroke="#e0556b" stroke-width="2"/>
<text x="330" y="396" text-anchor="middle" fill="#f7c2cc" font-size="11.5" font-weight="700">External Support</text>
<text x="330" y="412" text-anchor="middle" fill="#f7c2cc" font-size="11.5" font-weight="700">Required?</text>
<path d="M330 346 L330 358" stroke="#e0556b" stroke-width="1.6" stroke-dasharray="5 4" marker-end="url(#nR)"/>

<!-- NO right -->
<circle cx="486" cy="380" r="9" fill="#e0556b"/><path d="M482 376 l8 8 M490 376 l-8 8" stroke="#0a1226" stroke-width="2" stroke-linecap="round"/>
<text x="500" y="385" fill="#e0556b" font-size="12" font-weight="700">NO</text>
<path d="M464 400 L560 400" stroke="#e0556b" stroke-width="1.6" fill="none" stroke-dasharray="5 4"/>

<!-- YES down -->
<circle cx="286" cy="458" r="9" fill="#3fa87a"/><path d="M281 458 l4 4 l7 -8" fill="none" stroke="#0a1226" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/>
<text x="240" y="463" fill="#3fa87a" font-size="12" font-weight="700">YES</text>

<!-- Contact External Agencies -->
<rect x="196" y="474" width="268" height="38" rx="6" fill="#2a1420" stroke="#e0556b" stroke-width="1.6"/>
<text x="330" y="498" text-anchor="middle" fill="#f2a6b4" font-size="12.5" font-weight="700">Contact External Agencies</text>
<path d="M330 440 L330 472" stroke="#3fa87a" stroke-width="1.6" stroke-dasharray="5 4" marker-end="url(#nG)"/>

<!-- join rail up to Plan for Incident Handling -->
<path d="M464 493 L560 493 L560 148" stroke="#e0556b" stroke-width="1.6" fill="none" stroke-dasharray="5 4"/>
<path d="M560 148 L616 148" stroke="#e0556b" stroke-width="1.6" fill="none" stroke-dasharray="5 4" marker-end="url(#nR)"/>

<!-- Plan for Incident Handling -->
<rect x="618" y="122" width="284" height="38" rx="6" fill="#2a1420" stroke="#e0556b" stroke-width="1.6"/>
<text x="760" y="146" text-anchor="middle" fill="#f2a6b4" font-size="12.5" font-weight="700">Plan for Incident Handling</text>

<!-- end connector -->
<circle cx="760" cy="212" r="18" fill="#d4af37"/>
<text x="760" y="219" text-anchor="middle" fill="#0a1226" font-size="16" font-weight="700">…</text>
<path d="M760 160 L760 192" stroke="#e0556b" stroke-width="1.6" stroke-dasharray="5 4" marker-end="url(#nR)"/>
</svg>
