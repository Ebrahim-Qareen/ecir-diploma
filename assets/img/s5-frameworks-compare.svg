<svg viewBox="0 0 1060 520" xmlns="http://www.w3.org/2000/svg" font-family="Segoe UI, Arial, sans-serif" role="img" aria-label="NIST vs SANS vs EC-Council incident response lifecycle comparison">
<title>NIST vs SANS vs EC-Council</title>
<rect width="1060" height="520" fill="#0a1226"/>
<text x="28" y="34" fill="#fff" font-size="18" font-weight="700">Three Ways to Draw the Same Journey</text>
<text x="1032" y="34" fill="#d4af37" font-size="12" font-weight="700" text-anchor="end">IT GATE</text>
<text x="28" y="56" fill="#8ea3c8" font-size="12">Same work, different maps. Learn NIST for the exam — recognise the others when a company uses them.</text>

<!-- NIST -->
<rect x="24" y="76" width="1012" height="122" rx="10" fill="#0e1730" stroke="#37c7d4" stroke-width="1.6"/>
<text x="40" y="100" fill="#7fdce6" font-size="14" font-weight="700">NIST — 4 phases  ·  the one we teach</text>
<rect x="40" y="112" width="228" height="66" rx="8" fill="#15213f" stroke="#2b3f70"/>
<text x="154" y="138" text-anchor="middle" fill="#c7d3e8" font-size="12.5" font-weight="700">1 · Preparation</text>
<text x="154" y="158" text-anchor="middle" fill="#8ea3c8" font-size="10">get ready before anything happens</text>
<rect x="278" y="112" width="228" height="66" rx="8" fill="#15213f" stroke="#2b3f70"/>
<text x="392" y="138" text-anchor="middle" fill="#c7d3e8" font-size="12.5" font-weight="700">2 · Detection &amp; Analysis</text>
<text x="392" y="158" text-anchor="middle" fill="#8ea3c8" font-size="10">is it real? how bad?</text>
<rect x="516" y="112" width="288" height="66" rx="8" fill="#15213f" stroke="#2b3f70"/>
<text x="660" y="132" text-anchor="middle" fill="#c7d3e8" font-size="12.5" font-weight="700">3 · Containment, Eradication</text>
<text x="660" y="150" text-anchor="middle" fill="#c7d3e8" font-size="12.5" font-weight="700">&amp; Recovery</text>
<text x="660" y="168" text-anchor="middle" fill="#8ea3c8" font-size="10">stop it · remove it · restore it</text>
<rect x="814" y="112" width="206" height="66" rx="8" fill="#15213f" stroke="#2b3f70"/>
<text x="917" y="138" text-anchor="middle" fill="#c7d3e8" font-size="12.5" font-weight="700">4 · Post-Incident</text>
<text x="917" y="158" text-anchor="middle" fill="#8ea3c8" font-size="10">learn so it can't repeat</text>

<!-- SANS -->
<rect x="24" y="212" width="1012" height="112" rx="10" fill="#0e1730" stroke="#3fa87a" stroke-width="1.6"/>
<text x="40" y="236" fill="#7fe0b4" font-size="14" font-weight="700">SANS — 6 steps  ·  splits NIST's phase 3 into three</text>
<g font-size="11" font-weight="700" text-anchor="middle">
<rect x="40" y="250" width="152" height="56" rx="8" fill="#101f1a" stroke="#3fa87a"/><text x="116" y="274" fill="#8fd0b4">1 Preparation</text><text x="116" y="292" fill="#8ea3c8" font-size="9.5" font-weight="400">same as NIST</text>
<rect x="202" y="250" width="152" height="56" rx="8" fill="#101f1a" stroke="#3fa87a"/><text x="278" y="274" fill="#8fd0b4">2 Identification</text><text x="278" y="292" fill="#8ea3c8" font-size="9.5" font-weight="400">= detection</text>
<rect x="364" y="250" width="152" height="56" rx="8" fill="#101f1a" stroke="#3fa87a"/><text x="440" y="274" fill="#8fd0b4">3 Containment</text><text x="440" y="292" fill="#8ea3c8" font-size="9.5" font-weight="400">stop the spread</text>
<rect x="526" y="250" width="152" height="56" rx="8" fill="#101f1a" stroke="#3fa87a"/><text x="602" y="274" fill="#8fd0b4">4 Eradication</text><text x="602" y="292" fill="#8ea3c8" font-size="9.5" font-weight="400">remove it</text>
<rect x="688" y="250" width="152" height="56" rx="8" fill="#101f1a" stroke="#3fa87a"/><text x="764" y="274" fill="#8fd0b4">5 Recovery</text><text x="764" y="292" fill="#8ea3c8" font-size="9.5" font-weight="400">back to normal</text>
<rect x="850" y="250" width="170" height="56" rx="8" fill="#101f1a" stroke="#3fa87a"/><text x="935" y="274" fill="#8fd0b4">6 Lessons Learned</text><text x="935" y="292" fill="#8ea3c8" font-size="9.5" font-weight="400">= post-incident</text>
</g>

<!-- EC-Council -->
<rect x="24" y="338" width="1012" height="112" rx="10" fill="#0e1730" stroke="#8b7ce8" stroke-width="1.6"/>
<text x="40" y="362" fill="#b6a9f2" font-size="14" font-weight="700">EC-Council — 9 steps  ·  adds the office work (ticket, notify, report)</text>
<g font-size="10" font-weight="700" text-anchor="middle">
<rect x="40" y="376" width="104" height="56" rx="7" fill="#1a1533" stroke="#8b7ce8"/><text x="92" y="399" fill="#c3b8f5">1 Preparation</text>
<rect x="152" y="376" width="104" height="56" rx="7" fill="#1a1533" stroke="#8b7ce8"/><text x="204" y="399" fill="#c3b8f5">2 Recording</text><text x="204" y="414" fill="#8ea3c8" font-size="9" font-weight="400">open ticket</text>
<rect x="264" y="376" width="104" height="56" rx="7" fill="#1a1533" stroke="#8b7ce8"/><text x="316" y="399" fill="#c3b8f5">3 Triage</text>
<rect x="376" y="376" width="104" height="56" rx="7" fill="#1a1533" stroke="#8b7ce8"/><text x="428" y="399" fill="#c3b8f5">4 Notification</text><text x="428" y="414" fill="#8ea3c8" font-size="9" font-weight="400">tell people</text>
<rect x="488" y="376" width="104" height="56" rx="7" fill="#1a1533" stroke="#8b7ce8"/><text x="540" y="399" fill="#c3b8f5">5 Containment</text>
<rect x="600" y="376" width="104" height="56" rx="7" fill="#1a1533" stroke="#8b7ce8"/><text x="652" y="392" fill="#c3b8f5">6 Evidence</text><text x="652" y="407" fill="#c3b8f5">Gathering</text>
<rect x="712" y="376" width="104" height="56" rx="7" fill="#1a1533" stroke="#8b7ce8"/><text x="764" y="399" fill="#c3b8f5">7 Eradication</text>
<rect x="824" y="376" width="94" height="56" rx="7" fill="#1a1533" stroke="#8b7ce8"/><text x="871" y="399" fill="#c3b8f5">8 Recovery</text>
<rect x="926" y="376" width="94" height="56" rx="7" fill="#1a1533" stroke="#8b7ce8"/><text x="973" y="392" fill="#c3b8f5">9 Post-</text><text x="973" y="407" fill="#c3b8f5">Incident</text>
</g>

<!-- takeaway -->
<rect x="24" y="464" width="1012" height="44" rx="9" fill="#241a1a" stroke="#d4af37" stroke-width="1.3"/>
<text x="40" y="482" fill="#f0d78a" font-size="12.5" font-weight="700">The one thing to remember:</text>
<text x="228" y="482" fill="#c7d3e8" font-size="12">all three start with <tspan font-weight="700">Preparation</tspan> and end with <tspan font-weight="700">learning</tspan>. The middle is just split differently.</text>
<text x="40" y="500" fill="#8ea3c8" font-size="11">NIST 4 = SANS 6 = EC-Council 9. More steps ≠ more work — only more detail.</text>
</svg>
