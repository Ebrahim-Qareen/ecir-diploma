<svg viewBox="0 0 940 520" xmlns="http://www.w3.org/2000/svg" font-family="Segoe UI, Arial, sans-serif" role="img" aria-label="Process flow of incident triage: analysis and validation, classification, purview decision, prioritization">
<title>Process Flow of Incident Triage</title>
<defs>
  <marker id="tG" markerWidth="9" markerHeight="9" refX="7" refY="3.5" orient="auto"><path d="M0,0 L7,3.5 L0,7 Z" fill="#3fa87a"/></marker>
  <marker id="tR" markerWidth="9" markerHeight="9" refX="7" refY="3.5" orient="auto"><path d="M0,0 L7,3.5 L0,7 Z" fill="#e0556b"/></marker>
</defs>
<rect width="940" height="520" fill="#0a1226"/>
<text x="28" y="36" fill="#fff" font-size="17" font-weight="700">Process Flow of Incident Triage</text>
<text x="912" y="36" fill="#d4af37" font-size="11" font-weight="700" text-anchor="end">IT GATE</text>

<!-- start connector -->
<circle cx="640" cy="82" r="18" fill="#d4af37"/>
<text x="640" y="89" text-anchor="middle" fill="#0a1226" font-size="16" font-weight="700">…</text>

<!-- Incident Analysis and Validation -->
<rect x="490" y="132" width="300" height="38" rx="6" fill="#10241c" stroke="#3fa87a" stroke-width="1.6"/>
<text x="640" y="156" text-anchor="middle" fill="#9ceccb" font-size="12.5" font-weight="700">Incident Analysis and Validation</text>
<path d="M640 100 L640 130" stroke="#3fa87a" stroke-width="1.6" stroke-dasharray="5 4" marker-end="url(#tG)"/>

<!-- Incident Classification -->
<rect x="490" y="208" width="300" height="38" rx="6" fill="#10241c" stroke="#3fa87a" stroke-width="1.6"/>
<text x="640" y="232" text-anchor="middle" fill="#9ceccb" font-size="12.5" font-weight="700">Incident Classification</text>
<path d="M640 170 L640 206" stroke="#3fa87a" stroke-width="1.6" stroke-dasharray="5 4" marker-end="url(#tG)"/>

<!-- decision -->
<polygon points="640,272 862,330 640,388 418,330" fill="#10241c" stroke="#3fa87a" stroke-width="2"/>
<text x="640" y="319" text-anchor="middle" fill="#9ceccb" font-size="12" font-weight="700">Does the</text>
<text x="640" y="335" text-anchor="middle" fill="#9ceccb" font-size="12" font-weight="700">Incident Fall Outside the</text>
<text x="640" y="351" text-anchor="middle" fill="#9ceccb" font-size="12" font-weight="700">Team's Purview?</text>
<path d="M640 246 L640 270" stroke="#3fa87a" stroke-width="1.6" stroke-dasharray="5 4" marker-end="url(#tG)"/>

<!-- YES -> Other Organizational Departments -->
<circle cx="386" cy="310" r="9" fill="#3fa87a"/><path d="M381 310 l4 4 l7 -8" fill="none" stroke="#0a1226" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/>
<text x="400" y="315" fill="#3fa87a" font-size="12" font-weight="700">YES</text>
<rect x="40" y="312" width="280" height="38" rx="6" fill="#2a1420" stroke="#e0556b" stroke-width="1.6"/>
<text x="180" y="336" text-anchor="middle" fill="#f2a6b4" font-size="12.5" font-weight="700">Other Organizational Departments</text>
<path d="M418 330 L322 330" stroke="#3fa87a" stroke-width="1.6" stroke-dasharray="5 4" marker-end="url(#tG)"/>

<!-- NO down -->
<circle cx="672" cy="406" r="9" fill="#e0556b"/><path d="M668 402 l8 8 M676 402 l-8 8" stroke="#0a1226" stroke-width="2" stroke-linecap="round"/>
<text x="686" y="411" fill="#e0556b" font-size="12" font-weight="700">NO</text>

<!-- Incident Prioritization -->
<rect x="490" y="422" width="300" height="38" rx="6" fill="#10241c" stroke="#3fa87a" stroke-width="1.6"/>
<text x="640" y="446" text-anchor="middle" fill="#9ceccb" font-size="12.5" font-weight="700">Incident Prioritization</text>
<path d="M640 388 L640 420" stroke="#e0556b" stroke-width="1.6" stroke-dasharray="5 4" marker-end="url(#tR)"/>

<!-- end connector -->
<circle cx="640" cy="498" r="18" fill="#d4af37"/>
<text x="640" y="505" text-anchor="middle" fill="#0a1226" font-size="16" font-weight="700">…</text>
<path d="M640 460 L640 478" stroke="#3fa87a" stroke-width="1.6" stroke-dasharray="5 4" marker-end="url(#tG)"/>
</svg>
