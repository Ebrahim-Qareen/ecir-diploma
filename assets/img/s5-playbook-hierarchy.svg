<svg viewBox="0 0 1060 420" xmlns="http://www.w3.org/2000/svg" font-family="Segoe UI, Arial, sans-serif" role="img" aria-label="Documentation hierarchy and how use cases map to playbooks">
<title>Playbooks and use cases</title>
<defs><marker id="pb5" markerWidth="10" markerHeight="10" refX="8" refY="4" orient="auto"><path d="M0,0 L8,4 L0,8 Z" fill="#37c7d4"/></marker></defs>
<rect width="1060" height="420" fill="#0a1226"/>
<text x="28" y="34" fill="#fff" font-size="18" font-weight="700">Playbooks — From "What We Do" to "Click This, Then That"</text>
<text x="1032" y="34" fill="#d4af37" font-size="12" font-weight="700" text-anchor="end">IT GATE</text>
<text x="28" y="56" fill="#8ea3c8" font-size="12">The IR process says containment happens. The playbook says exactly HOW to contain a phishing email.</text>

<!-- pyramid -->
<text x="28" y="96" fill="#f0d78a" font-size="14" font-weight="700">Zoom level</text>
<polygon points="250,110 340,180 160,180" fill="#241a1a" stroke="#d4af37" stroke-width="1.5"/>
<text x="250" y="150" text-anchor="middle" fill="#f0d78a" font-size="11.5" font-weight="700">POLICY</text>
<rect x="120" y="188" width="260" height="52" rx="7" fill="#0e1730" stroke="#37c7d4" stroke-width="1.5"/>
<text x="250" y="210" text-anchor="middle" fill="#7fdce6" font-size="12" font-weight="700">IR PLAN / PROCESS</text>
<text x="250" y="228" text-anchor="middle" fill="#8ea3c8" font-size="9.5">phases · RACI · escalation · severity</text>
<rect x="90" y="248" width="320" height="60" rx="7" fill="#101f1a" stroke="#3fa87a" stroke-width="1.5"/>
<text x="250" y="270" text-anchor="middle" fill="#7fe0b4" font-size="12" font-weight="700">PLAYBOOKS</text>
<text x="250" y="288" text-anchor="middle" fill="#8ea3c8" font-size="9.5">one per incident type — the granular steps</text>
<text x="250" y="302" text-anchor="middle" fill="#8ea3c8" font-size="9.5">phishing · malware · ransomware · account compromise</text>
<text x="250" y="332" text-anchor="middle" fill="#8ea3c8" font-size="10.5" font-style="italic">More detail as you go down</text>

<!-- mapping -->
<rect x="452" y="96" width="584" height="212" rx="10" fill="#0e1730" stroke="#8b7ce8" stroke-width="1.5"/>
<text x="472" y="120" fill="#b6a9f2" font-size="14" font-weight="700">Many use cases → one playbook</text>
<text x="472" y="140" fill="#8ea3c8" font-size="10.5">Detection engineering writes hundreds of rules, but only a dozen playbooks.</text>

<g font-size="10">
<rect x="472" y="154" width="200" height="30" rx="6" fill="#15213f" stroke="#2b3f70"/><text x="486" y="173" fill="#c7d3e8">Email from new domain</text>
<rect x="472" y="190" width="200" height="30" rx="6" fill="#15213f" stroke="#2b3f70"/><text x="486" y="209" fill="#c7d3e8">Known bad link in email</text>
<rect x="472" y="226" width="200" height="30" rx="6" fill="#15213f" stroke="#2b3f70"/><text x="486" y="245" fill="#c7d3e8">Suspicious attachment type</text>
<rect x="472" y="262" width="200" height="30" rx="6" fill="#15213f" stroke="#2b3f70"/><text x="486" y="281" fill="#c7d3e8">Typosquatted sender domain</text>
</g>
<text x="472" y="150" fill="#8ea3c8" font-size="9"></text>
<rect x="800" y="196" width="200" height="56" rx="8" fill="#101f1a" stroke="#3fa87a" stroke-width="1.6"/>
<text x="900" y="220" text-anchor="middle" fill="#7fe0b4" font-size="12.5" font-weight="700">PHISHING</text>
<text x="900" y="240" text-anchor="middle" fill="#7fe0b4" font-size="12.5" font-weight="700">PLAYBOOK</text>
<path d="M676 169 L796 214" stroke="#37c7d4" stroke-width="1.4" marker-end="url(#pb5)"/>
<path d="M676 205 L796 219" stroke="#37c7d4" stroke-width="1.4" marker-end="url(#pb5)"/>
<path d="M676 241 L796 228" stroke="#37c7d4" stroke-width="1.4" marker-end="url(#pb5)"/>
<path d="M676 277 L796 236" stroke="#37c7d4" stroke-width="1.4" marker-end="url(#pb5)"/>

<!-- prerequisites -->
<rect x="24" y="348" width="1012" height="60" rx="10" fill="#1a1533" stroke="#8b7ce8" stroke-width="1.3"/>
<text x="44" y="370" fill="#b6a9f2" font-size="12.5" font-weight="700">Before a playbook can work — the prerequisites</text>
<text x="44" y="392" fill="#c7d3e8" font-size="11.5">✔ The logs exist and reach the SIEM   ✔ They are parsed and searchable   ✔ Required fields are present (user, IP, process, hash)   ✔ Detection rules (use cases) exist   ✔ Response tools are in place</text>
</svg>
