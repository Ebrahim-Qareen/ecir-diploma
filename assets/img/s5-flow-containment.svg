<svg viewBox="0 0 1040 580" xmlns="http://www.w3.org/2000/svg" font-family="Segoe UI, Arial, sans-serif" role="img" aria-label="Process flow of incident containment: determine a containment strategy, technical, management and legal response branches, task assignment, incident contained decision, escalation">
<title>Process Flow of Incident Containment</title>
<defs>
  <marker id="cG" markerWidth="9" markerHeight="9" refX="7" refY="3.5" orient="auto"><path d="M0,0 L7,3.5 L0,7 Z" fill="#3fa87a"/></marker>
  <marker id="cR" markerWidth="9" markerHeight="9" refX="7" refY="3.5" orient="auto"><path d="M0,0 L7,3.5 L0,7 Z" fill="#e0556b"/></marker>
  <marker id="cS" markerWidth="10" markerHeight="10" refX="8" refY="4" orient="auto"><path d="M0,0 L8,4 L0,8 Z" fill="#8ea3c8"/></marker>
</defs>
<rect width="1040" height="580" fill="#0a1226"/>
<text x="28" y="36" fill="#fff" font-size="17" font-weight="700">Process Flow of Incident Containment</text>
<text x="1012" y="36" fill="#d4af37" font-size="11" font-weight="700" text-anchor="end">IT GATE</text>

<!-- start connector -->
<circle cx="180" cy="86" r="18" fill="#d4af37"/>
<text x="180" y="93" text-anchor="middle" fill="#0a1226" font-size="16" font-weight="700">…</text>

<!-- Determine a Containment Strategy (highlighted) -->
<rect x="46" y="130" width="268" height="38" rx="6" fill="#2a1420" stroke="#d4af37" stroke-width="2.6"/>
<text x="180" y="154" text-anchor="middle" fill="#f2a6b4" font-size="12.5" font-weight="700">Determine a Containment Strategy</text>
<path d="M180 104 L180 128" stroke="#e0556b" stroke-width="1.6" stroke-dasharray="5 4" marker-end="url(#cR)"/>

<!-- External Support Input -->
<rect x="396" y="130" width="212" height="38" rx="6" fill="#0d2030" stroke="#37c7d4" stroke-width="1.6"/>
<text x="502" y="154" text-anchor="middle" fill="#7fdce6" font-size="12.5" font-weight="700">External Support Input</text>
<path d="M394 149 L318 149" stroke="#8ea3c8" stroke-width="2.4" marker-end="url(#cS)"/>
<path d="M502 168 L502 218" stroke="#8ea3c8" stroke-width="2.4" marker-end="url(#cS)"/>

<!-- D1 Technical -->
<polygon points="180,190 314,232 180,274 46,232" fill="#2a1420" stroke="#e0556b" stroke-width="2"/>
<text x="180" y="228" text-anchor="middle" fill="#f7c2cc" font-size="11.5" font-weight="700">Technical Response</text>
<text x="180" y="244" text-anchor="middle" fill="#f7c2cc" font-size="11.5" font-weight="700">Required?</text>
<path d="M180 168 L180 188" stroke="#e0556b" stroke-width="1.6" stroke-dasharray="5 4" marker-end="url(#cR)"/>
<circle cx="336" cy="212" r="9" fill="#3fa87a"/><path d="M331 212 l4 4 l7 -8" fill="none" stroke="#0a1226" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/>
<text x="350" y="217" fill="#3fa87a" font-size="12" font-weight="700">YES</text>
<rect x="396" y="222" width="212" height="46" rx="6" fill="#0d2030" stroke="#37c7d4" stroke-width="1.6"/>
<text x="502" y="242" text-anchor="middle" fill="#7fdce6" font-size="12" font-weight="700">Task is Assigned</text>
<text x="502" y="259" text-anchor="middle" fill="#7fdce6" font-size="12" font-weight="700">to Technical Team</text>
<path d="M314 232 L394 240" stroke="#3fa87a" stroke-width="1.6" stroke-dasharray="5 4" marker-end="url(#cG)"/>

<!-- NO -->
<circle cx="126" cy="290" r="9" fill="#e0556b"/><path d="M122 286 l8 8 M130 286 l-8 8" stroke="#0a1226" stroke-width="2" stroke-linecap="round"/>
<text x="80" y="295" fill="#e0556b" font-size="12" font-weight="700">NO</text>

<!-- D2 Management -->
<polygon points="180,306 314,348 180,390 46,348" fill="#2a1420" stroke="#e0556b" stroke-width="2"/>
<text x="180" y="344" text-anchor="middle" fill="#f7c2cc" font-size="11.5" font-weight="700">Management</text>
<text x="180" y="360" text-anchor="middle" fill="#f7c2cc" font-size="11.5" font-weight="700">Response Required?</text>
<path d="M180 274 L180 304" stroke="#e0556b" stroke-width="1.6" stroke-dasharray="5 4" marker-end="url(#cR)"/>
<circle cx="336" cy="328" r="9" fill="#3fa87a"/><path d="M331 328 l4 4 l7 -8" fill="none" stroke="#0a1226" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/>
<text x="350" y="333" fill="#3fa87a" font-size="12" font-weight="700">YES</text>
<rect x="396" y="326" width="212" height="46" rx="6" fill="#0d2030" stroke="#37c7d4" stroke-width="1.6"/>
<text x="502" y="346" text-anchor="middle" fill="#7fdce6" font-size="12" font-weight="700">Task is Assigned</text>
<text x="502" y="363" text-anchor="middle" fill="#7fdce6" font-size="12" font-weight="700">to Management Team</text>
<path d="M314 348 L394 348" stroke="#3fa87a" stroke-width="1.6" stroke-dasharray="5 4" marker-end="url(#cG)"/>

<!-- NO -->
<circle cx="126" cy="406" r="9" fill="#e0556b"/><path d="M122 402 l8 8 M130 402 l-8 8" stroke="#0a1226" stroke-width="2" stroke-linecap="round"/>
<text x="80" y="411" fill="#e0556b" font-size="12" font-weight="700">NO</text>

<!-- D3 Legal -->
<polygon points="180,422 314,464 180,506 46,464" fill="#2a1420" stroke="#e0556b" stroke-width="2"/>
<text x="180" y="460" text-anchor="middle" fill="#f7c2cc" font-size="11.5" font-weight="700">Legal Response</text>
<text x="180" y="476" text-anchor="middle" fill="#f7c2cc" font-size="11.5" font-weight="700">Required?</text>
<path d="M180 390 L180 420" stroke="#e0556b" stroke-width="1.6" stroke-dasharray="5 4" marker-end="url(#cR)"/>
<circle cx="336" cy="444" r="9" fill="#3fa87a"/><path d="M331 444 l4 4 l7 -8" fill="none" stroke="#0a1226" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/>
<text x="350" y="449" fill="#3fa87a" font-size="12" font-weight="700">YES</text>
<rect x="396" y="442" width="212" height="46" rx="6" fill="#0d2030" stroke="#37c7d4" stroke-width="1.6"/>
<text x="502" y="462" text-anchor="middle" fill="#7fdce6" font-size="12" font-weight="700">Task is Assigned</text>
<text x="502" y="479" text-anchor="middle" fill="#7fdce6" font-size="12" font-weight="700">to Legal Team</text>
<path d="M314 464 L394 464" stroke="#3fa87a" stroke-width="1.6" stroke-dasharray="5 4" marker-end="url(#cG)"/>

<!-- NO -> Provide Initial Response and Close the Case -->
<circle cx="126" cy="522" r="9" fill="#e0556b"/><path d="M122 518 l8 8 M130 518 l-8 8" stroke="#0a1226" stroke-width="2" stroke-linecap="round"/>
<text x="80" y="527" fill="#e0556b" font-size="12" font-weight="700">NO</text>
<rect x="46" y="530" width="268" height="46" rx="6" fill="#2a1420" stroke="#e0556b" stroke-width="1.6"/>
<text x="180" y="550" text-anchor="middle" fill="#f2a6b4" font-size="12" font-weight="700">Provide Initial Response and Close</text>
<text x="180" y="567" text-anchor="middle" fill="#f2a6b4" font-size="12" font-weight="700">the Case</text>
<path d="M180 506 L180 528" stroke="#e0556b" stroke-width="1.6" stroke-dasharray="5 4" marker-end="url(#cR)"/>

<!-- tasks merge rail -> Incident Contained? -->
<path d="M608 245 L676 245 L676 465 L608 465" stroke="#8ea3c8" stroke-width="1.6" fill="none" stroke-dasharray="5 4"/>
<path d="M608 349 L676 349" stroke="#8ea3c8" stroke-width="1.6" fill="none" stroke-dasharray="5 4"/>
<path d="M676 349 L802 349" stroke="#8ea3c8" stroke-width="1.6" fill="none" stroke-dasharray="5 4" marker-end="url(#cS)"/>

<!-- Incident Contained? (green diamond) -->
<polygon points="918,306 1030,349 918,392 806,349" fill="#10241c" stroke="#3fa87a" stroke-width="2"/>
<text x="918" y="354" text-anchor="middle" fill="#9ceccb" font-size="11.5" font-weight="700">Incident Contained?</text>

<!-- NO up -> Escalate -->
<circle cx="874" cy="286" r="9" fill="#e0556b"/><path d="M870 282 l8 8 M878 282 l-8 8" stroke="#0a1226" stroke-width="2" stroke-linecap="round"/>
<text x="834" y="291" fill="#e0556b" font-size="12" font-weight="700">NO</text>
<rect x="786" y="222" width="248" height="38" rx="6" fill="#10241c" stroke="#3fa87a" stroke-width="1.6"/>
<text x="910" y="246" text-anchor="middle" fill="#9ceccb" font-size="11.5" font-weight="700">Escalate the Containment Task</text>
<path d="M918 306 L918 264" stroke="#e0556b" stroke-width="1.6" stroke-dasharray="5 4" marker-end="url(#cR)"/>

<!-- Return to Containment Strategy -->
<rect x="812" y="128" width="212" height="46" rx="6" fill="#10241c" stroke="#3fa87a" stroke-width="1.6"/>
<text x="918" y="148" text-anchor="middle" fill="#9ceccb" font-size="12" font-weight="700">Return to</text>
<text x="918" y="165" text-anchor="middle" fill="#9ceccb" font-size="12" font-weight="700">Containment Strategy</text>
<path d="M918 222 L918 178" stroke="#3fa87a" stroke-width="1.6" stroke-dasharray="5 4" marker-end="url(#cG)"/>

<!-- YES -> end connector -->
<circle cx="874" cy="412" r="9" fill="#3fa87a"/><path d="M869 412 l4 4 l7 -8" fill="none" stroke="#0a1226" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/>
<text x="828" y="417" fill="#3fa87a" font-size="12" font-weight="700">YES</text>
<circle cx="918" cy="466" r="18" fill="#d4af37"/>
<text x="918" y="473" text-anchor="middle" fill="#0a1226" font-size="16" font-weight="700">…</text>
<path d="M918 392 L918 446" stroke="#3fa87a" stroke-width="1.6" stroke-dasharray="5 4" marker-end="url(#cG)"/>
</svg>
